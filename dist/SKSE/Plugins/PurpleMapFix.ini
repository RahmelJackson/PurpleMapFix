[Map]
; Fixes the purple/blank world map caused by load order. A plugin that edits anything
; in a worldspace (one placed object, an NPC) carries a full copy of that worldspace,
; and if it loads after a map mod (FWMF, flat or paper maps) it silently resets the map
; camera and scale. At startup this reads every plugin's worldspace records and puts
; back the map settings that were last changed on purpose. Nothing on disk is changed.
bRestoreMapData = 1

; Write PurpleMapFix-LoadOrder.txt next to the log each time the game starts: which
; plugins reset the map settings, and the load order change that fixes it for good.
; "PurpleMapFix Tools\Fix Load Order.bat" applies that change (with a backup).
bWriteLoadOrderReport = 1

; What your world map looks like, which decides the patch texture:
;   auto  = detect from plugin names (a loaded plugin with "map" plus "paper",
;           "flat" or "parchment" in its file name means paper)
;   paper = paper 3D maps and flat maps: broken spots become parchment
;   stone = vanilla-style map: broken spots become gray stone
sMapStyle = auto

; What to do with broken distant objects (buildings, trees, rocks) on the map:
;   auto  = hide on paper/flat maps, patch on stone maps
;   hide  = remove them, so you just see the terrain underneath
;   patch = keep them, with the fallback texture
sObjectLODMode = auto

; Optional: your own texture for patched map spots, e.g. a texture from your
; paper map mod so patches match it exactly. Path is relative to Data.
; Leave empty to use the built-in parchment/stone texture.
sCustomMapTexture =

[Scanning]
; Check the map's textures when the world map opens, plus a couple of quick
; follow-ups for parts that finish loading a moment later. Nothing is checked at
; any other time.
bScanOnMapOpen = 1

; Number of follow-up checks after the map opens (1 s, then every 3 s). 0-5.
iFollowUpScans = 2

; 0 = only check the distant terrain and object LOD the map is drawn from (fast).
; 1 = check every mesh in the scene (slow, only for troubleshooting).
bScanWholeWorld = 0

; 1 = patch or hide broken meshes. 0 = only write them to the log.
bReplaceBrokenTextures = 1

; Also check and patch purple objects near the player (with the stone texture).
; Off by default: it means checking every mesh around you, and nearby purple is a
; different problem from the map.
bPatchNearbyObjects = 0

; Also treat files that exist but aren't real DDS files as broken (0-byte files,
; renamed PNGs). Off by default: reading a texture's header out of a compressed
; BSA can mean unpacking the whole texture, which is slow.
bCheckDDSHeaders = 0

; Show a small notification in the top-left when something was fixed.
bShowNotification = 1

; Unlit meshes at least this big (bounding radius, game units) count as a flat
; world map. Smaller unlit meshes (fire, glows) are only logged, never patched.
fFlatMapMinRadius = 4096

[Textures]
; Built-in fallback textures shipped with this mod. Only change these if you
; moved or replaced them.
sStoneTexture = textures\PurpleMapFix\fallback_d.dds
sPaperTexture = textures\PurpleMapFix\fallback_paper_d.dds
sFlatNormal = textures\PurpleMapFix\fallback_n.dds
