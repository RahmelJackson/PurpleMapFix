name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release: Actions tab -> CI -> Run workflow -> enter the version.
  # Builds the mod and creates a DRAFT release with the zip, to check and publish.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        default: "1.0.1"

env:
  # Same commit build.ps1 pins.
  COMMONLIB_COMMIT: b93280e832f263dbef44e44cbe2936622a02f91a

jobs:
  tests:
    name: Resolver tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Run tests
        run: sh tests/run_tests.sh

  build:
    name: Build DLL (Windows)
    runs-on: windows-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Get CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/CharmedBaryon/CommonLibSSE-NG.git lib/commonlibsse-ng
          git -C lib/commonlibsse-ng checkout --quiet $env:COMMONLIB_COMMIT
          git -C lib/commonlibsse-ng submodule update --init --recursive --quiet

      - name: Build
        shell: pwsh
        run: |
          xmake f -m releasedbg -y
          xmake -y

      - name: Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ver = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $ver = $env:RELEASE_VERSION }
          New-Item -ItemType Directory -Force symbols | Out-Null
          Move-Item dist/SKSE/Plugins/PurpleMapFix.pdb symbols/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "PurpleMapFix-$ver.zip"
          Compress-Archive -Path symbols/* -DestinationPath "PurpleMapFix-$ver-pdb.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PurpleMapFix
          path: PurpleMapFix-*.zip

      # A draft release, so it can be checked before it goes public. The v<version>
      # tag is created on this commit when the draft is published.
      - name: Draft release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Purple Map Fix ${{ inputs.version }}
          body_path: .github/release-notes.md
          files: PurpleMapFix-*.zip
